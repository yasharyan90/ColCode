# Local development dependencies. App services run via `npm run dev` on the host
# (the runner needs the host Docker daemon). Production compose lands with deployment.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: colcode
      POSTGRES_PASSWORD: colcode
      POSTGRES_DB: colcode
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U colcode"]
      interval: 3s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
volumes:
  pgdata:
