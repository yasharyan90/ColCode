# Production stack. Configure .env.production (see .env.production.example), then:
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
# Deploy to a remote Docker host the same way with DOCKER_HOST=ssh://user@host (scripts/deploy.sh).
#
# Network layout: only `web` is published. api/sync sit behind it; postgres/redis are reachable
# only from api/sync; the runner is reachable only from api and is the sole service holding the
# Docker socket (it creates the per-run sandbox containers on the host daemon).

name: colcode-prod

x-env: &app-env
  NODE_ENV: ${NODE_ENV:-production}
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env.production}
  DATABASE_URL: postgres://colcode:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/colcode
  REDIS_URL: redis://redis:6379

services:
  web:
    build: { context: ., target: web }
    image: colcode/web
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api: { condition: service_healthy }
      sync: { condition: service_healthy }
    networks: [edge]

  api:
    build: { context: ., target: api }
    image: colcode/api
    restart: unless-stopped
    environment:
      <<: *app-env
      PORT: 4000
      APP_URL: ${APP_URL:?set APP_URL}
      OAUTH_CALLBACK_URL: ${APP_URL}/api/auth/github/callback
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      AUTH_DEV_LOGIN: ${AUTH_DEV_LOGIN:-0}
      RUNNER_URL: http://runner:4100
      RUN_RATE_MAX: ${RUN_RATE_MAX:-10}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
      runner: { condition: service_healthy }
    networks: [edge, data, exec]
    deploy:
      resources:
        limits: { memory: 512M }

  sync:
    build: { context: ., target: sync }
    image: colcode/sync
    restart: unless-stopped
    environment:
      <<: *app-env
      PORT: 1234
      SNAPSHOT_DEBOUNCE_MS: ${SNAPSHOT_DEBOUNCE_MS:-2000}
    depends_on:
      postgres: { condition: service_healthy }
    networks: [edge, data]
    deploy:
      resources:
        limits: { memory: 1G }

  runner:
    build: { context: ., target: runner }
    image: colcode/runner
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4100
      RUN_MAX_CONCURRENT: ${RUN_MAX_CONCURRENT:-4}
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      # Root-equivalent access to the host daemon — by design the only service that has it.
      # Harden further with a socket proxy (tecnativa/docker-socket-proxy) or a rootless/remote
      # daemon dedicated to sandboxes.
      - /var/run/docker.sock:/var/run/docker.sock
    user: root
    networks: [exec]
    deploy:
      resources:
        limits: { memory: 256M }

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: colcode
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: colcode
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U colcode"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [data]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    networks: [data]

networks:
  edge: {}
  data: { internal: true }
  exec: { internal: true }

volumes:
  pgdata:
  caddy_data:
  caddy_config:
